spring:
  application:
    name: solar-sync-broker-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/solarsync}
    username: ${DB_USERNAME:solarsync}
    password: ${DB_PASSWORD:solarsync}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
