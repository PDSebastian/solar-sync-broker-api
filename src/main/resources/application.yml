spring:
  application:
    name: solar-sync-broker-api
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/solarSyncBroker-api?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

application:
  jwt:
    secretKey: ${JWT_SECRET_KEY:dev-only-solarsync-secret-key-please-change-in-prod-0123456789ABCDEF}
    tokenExpirationAfterDays: 7

solarsync:
  simulation:
    seed: 42
    tick-seconds: 60
    real-to-virtual-ratio: 60
  grid:
    transformer-nominal-kw: 50
    safety-margin-percent: 10
  agent:
    mode: ADVISORY
    planning-interval-seconds: 300
