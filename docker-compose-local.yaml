services:
  mysql-server:
    image: mysql:8.4
    container_name: solarsyncbroker-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: solarsyncbroker_db
    ports:
      - "3310:3306"
    volumes:
      - mysql_solarsync_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  app:
    image: sebi123q/solarsyncbroker-app:1.0
    container_name: solarsyncbroker-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql-server:3306/solarsyncbroker_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      JPA_SHOW_SQL: "true"
    depends_on:
      mysql-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_solarsync_data: