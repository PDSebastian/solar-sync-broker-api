services:
  mysql-server:
    image: mysql:8.4
    container_name: solarsyncbroker-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: solarsync_db
    ports:
      - "3310:3306"
    volumes:
      - mysql_solarsync_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  solarsyncbroker-app:
    image: sebi123q/solarsyncbroker-app:2.0
    container_name: solarsyncbroker
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: "8090"
      DB_URL: jdbc:mysql://mysql-server:3306/solarsync_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET_KEY: "asdasdasdasdasd123344asdasdasdasdasasd12321332sadasXYZ0123456789ABCDEF"
    depends_on:
      mysql-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_solarsync_data: